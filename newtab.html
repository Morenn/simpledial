<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <title>My SpeedDial</title>
  <link rel="stylesheet" href="style.css">
  <script src="libs/jszip.min.js"></script>

</head>

<body class="theme-dark">

  <!-- Horná lišta -->
  <header id="top-bar">
    <div id="groups-header"></div>
    <div id="manage">
      <input id="search-box" type="text" placeholder="Hľadať...">
      <button id="theme-toggle" title="Prepnúť tému">🌓</button>
      <button id="export-btn">Export</button>
      <button id="import-btn">Import</button>
      <button id="webdav-settings-btn" title="Nastavenia WebDAV">⚙️ WebDAV</button>
      <label class="show-deleted-toggle">
        <input type="checkbox" id="show-deleted-toggle">
        Zobraziť zmazané
      </label>
    </div>
  </header>

  <!-- Hlavná časť -->
  <main>
    <div id="bookmarks-grid">
      <!-- Bookmarky sa renderujú dynamicky -->
    </div>
  </main>

  <!-- Kontextové menu -->
  <div id="context-menu" class="hidden">
    <div data-action="edit">Upraviť</div>
    <div data-action="delete">Zmazať</div>
    <div data-action="restore">Obnoviť</div>
    <div data-action="refresh-icon">Obnoviť ikonu</div>
  </div>

  <!-- Modal pre pridanie/upravu bookmarku -->
  <div id="bookmark-modal" class="modal hidden">
    <div class="modal-content">
      <h2 id="modal-title">Nová záložka</h2>

      <label for="bm-title">Názov</label>
      <input type="text" id="bm-title">

      <label for="bm-url">URL</label>
      <input type="url" id="bm-url">

      <label for="bm-icon">URL ikony (voliteľné)</label>
      <input type="url" id="bm-icon">

      <div class="modal-buttons">
        <button id="bm-save">Uložiť</button>
        <button id="bm-cancel">Zrušiť</button>
      </div>
    </div>
  </div>
  <!-- Modal pre WebDAV nastavenia -->
  <div id="webdav-modal" class="modal hidden">
    <div class="modal-content">
      <h2>WebDAV Synchronizácia</h2>

      <label>WebDAV URL</label>
      <input type="text" id="webdav-url" placeholder="https://server/dav/speeddial">

      <label>Používateľské meno</label>
      <input type="text" id="webdav-username" placeholder="username">

      <label>Heslo</label>
      <input type="password" id="webdav-password" placeholder="••••••••">

      <button id="webdav-test" class="icon-btn">🔍 Testovať pripojenie</button>

      <label class="checkbox-row">
        <input type="checkbox" id="webdav-enable">
        🔄 Zapnúť synchronizáciu
      </label>

      <div id="webdav-status" class="status"></div>

      <div class="modal-buttons">
        <button id="webdav-save" class="icon-btn primary">💾 Uložiť</button>
        <button id="webdav-cancel" class="icon-btn danger">❌ Zavrieť</button>
      </div>
    </div>
  </div>

  <script type="module" src="newtab/main.js"></script>
</body>
</html>
