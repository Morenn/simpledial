<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <title>My SpeedDial</title>
  <link rel="stylesheet" href="style.css">
  <script src="libs/jszip.min.js"></script>

</head>

<body class="theme-dark">

  <!-- Horná lišta -->
  <header id="top-bar">
    <div id="groups-header">
    </div>
    <div id="manage">
      <input id="search-box" type="text" placeholder="Hľadať...">
      <button id="theme-toggle" title="Prepnúť tému">🌓</button>

      <details id="advanced-controls">
        <summary>⚙️</summary>
        <div class="advanced-content">
          <button id="export-btn">Export</button>
          <button id="import-btn">Import</button>
          <button id="sync-settings-btn" class="icon-btn">⚙️ Sync nastavenia</button>
          <label class="show-deleted-toggle">
            <input type="checkbox" id="show-deleted-toggle">
            Zobraziť zmazané
          </label>
          <div class="language-selector">
            <label for="language-select" data-i18n="language">Jazyk:</label>
            <select id="language-select">
              <option value="sk" data-i18n="slovak">Slovenčina</option>
              <option value="en" data-i18n="english">English</option>
            </select>
          </div>
        </div>
      </details>
    </div>
  </header>

  <!-- Hlavná časť -->
  <main>
    <div id="bookmarks-grid">
      <!-- Bookmarky sa renderujú dynamicky -->
    </div>
  </main>

  <!-- Kontextové menu -->
  <div id="context-menu" class="hidden">
    <div data-action="edit">Upraviť</div>
    <div data-action="delete">Zmazať</div>
    <div data-action="restore">Obnoviť</div>
    <div data-action="refresh-icon">Obnoviť ikonu</div>
  </div>

  <!-- Modal pre pridanie/upravu bookmarku -->
  <div id="bookmark-modal" class="modal hidden">
    <div class="modal-content">
      <h2 id="modal-title">Nová záložka</h2>

      <label for="bm-title">Názov</label>
      <input type="text" id="bm-title">

      <label for="bm-url">URL</label>
      <input type="url" id="bm-url">

      <label for="bm-icon">URL ikony (voliteľné)</label>
      <input type="url" id="bm-icon">

      <div class="modal-buttons">
        <button id="bm-save">Uložiť</button>
        <button id="bm-cancel">Zrušiť</button>
      </div>
    </div>
  </div>

  <!-- Modal pre Sync nastavenia -->
  <div id="sync-modal" class="modal hidden">
    <div class="modal-content">
      <h2>Sync Server</h2>

      <label>Server URL</label>
      <input type="text" id="sync-url" placeholder="https://sync.local/speeddial.json">

      <button id="sync-test" class="icon-btn">🔍 Testovať pripojenie</button>

      <label class="checkbox-row">
        <input type="checkbox" id="sync-enable">
        🔄 Zapnúť synchronizáciu
      </label>

      <div id="sync-status" class="status"></div>

      <div class="modal-buttons">
        <button id="sync-save" class="icon-btn primary">💾 Uložiť</button>
        <button id="sync-cancel" class="icon-btn danger">❌ Zavrieť</button>
      </div>
    </div>
  </div>
  <script type="module" src="newtab/sync.js"></script>
  <script type="module" src="newtab/main.js"></script>
</body>
</html>
